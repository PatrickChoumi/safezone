# blocker-adulte — configuration locale
#
# Installe dans : /etc/blocker-adulte/blocker.conf
#
# Ce fichier est lu par tous les scripts du projet via blocker-common.sh. Il
# n'est PAS rendu immuable et n'est jamais ecrase par une mise a jour : c'est
# le seul endroit prevu pour ajuster le comportement de l'outil.
#
# Apres modification :
#   sudo systemctl restart blocker-resolver.service blocker-guard.service

# --- Resolveurs amont -------------------------------------------------------
# Servent de secours pour tout domaine absent des listes locales. Les valeurs
# par defaut sont Cloudflare for Families, qui filtre deja le contenu adulte
# cote serveur : c'est une deuxieme barriere independante des listes.
#
# Autres resolveurs filtrants possibles :
#
#   AdGuard DNS Family    94.140.14.15 / 94.140.15.16   (defaut)
#     Filtre a la fois le contenu adulte, les publicites et les traqueurs, et
#     force le SafeSearch cote serveur — ce qui vient en redondance du
#     composant SafeSearch local. Contreparties : un filtrage plus large casse
#     occasionnellement un site legitime, et une societe tierce voit toutes vos
#     requetes DNS.
#
#   Cloudflare for Families  1.1.1.3 / 1.0.0.3
#     Adulte + malware seulement, pas de publicites. Plus rapide et plus
#     neutre : moins de faux positifs, politique de non-conservation des
#     journaux auditee publiquement. A preferer si un site utile casse.
#
#   CleanBrowsing Family     185.228.168.168 / 185.228.169.168
#   OpenDNS FamilyShield     208.67.222.123 / 208.67.220.123
#   Quad9 (securite seule, sans filtre adulte)  9.9.9.9
#
# Apres modification :
#   sudo /usr/lib/blocker-adulte/blocker-upstream
#   sudo systemctl restart blocker-resolver.service
#
# Le self-heal detecte de lui-meme un ecart entre ce reglage et le fichier
# effectivement utilise, et le corrige a la passe suivante.
BLOCKER_UPSTREAM_1="94.140.14.15"
BLOCKER_UPSTREAM_2="94.140.15.16"

# --- Rythme des watchdogs ---------------------------------------------------
# Intervalle, en secondes, entre deux passes de blocker-guard et de la boucle
# de surveillance croisee du resolveur.
#
# Doit rester nettement inferieur au WatchdogSec des unites systemd (60 s) :
# au-dela, systemd considererait les services bloques et les redemarrerait en
# boucle. Valeurs raisonnables : 10 a 25.
BLOCKER_GUARD_INTERVAL="15"

# --- Verrouillage de /etc/hosts ---------------------------------------------
# Une seule ligne dans /etc/hosts contourne entierement le resolveur : la
# resolution systeme lit ce fichier avant d'interroger le DNS. C'est le
# contournement le plus simple qui existe.
#
# Le rendre immuable ferme ce trou, mais /etc/hosts appartient au systeme et
# d'autres logiciels l'ecrivent legitimement (Docker, podman, LXC, Vagrant,
# cloud-init).
#
#   auto  (defaut) verrouille, sauf si l'un de ces logiciels est detecte ;
#                  l'abstention est journalisee
#   oui            verrouille toujours — peut casser Docker et consorts
#   non            ne verrouille jamais ; /etc/hosts reste seulement surveille
#                  par auditd (composant 8)
BLOCKER_LOCK_HOSTS="auto"

# --- SafeSearch force -------------------------------------------------------
# Fait resoudre Google, YouTube, Bing, DuckDuckGo, Yandex et Pixabay vers leur
# variante verrouillee en mode strict (forcesafesearch.google.com, etc.).
#
# C'est la mesure la plus efficace de tout l'outil : une liste de blocage ne
# peut rien contre Google Images ou YouTube, qu'on ne peut pas bloquer sans
# rendre la machine inutilisable. Forcer le SafeSearch au niveau du reseau rend
# le reglage impossible a changer depuis le navigateur ou le compte, et vaut
# pour toutes les applications de la machine.
#
# Les adresses sont resolues a chaque mise a jour, jamais codees en dur.
#
#   oui (defaut)  SafeSearch force
#   non           desactive ; le fichier genere est retire
BLOCKER_SAFESEARCH="oui"

# --- Extensions de navigateur -----------------------------------------------
# Le contournement le plus facile de tout le dispositif ne demande aucun droit
# root : installer une extension VPN/proxy dans le navigateur. Tout le trafic
# part alors chiffre vers un serveur tiers qui fait sa propre resolution DNS,
# invisible pour le resolveur local comme pour nftables.
#
# Les policies deployees ferment ce trou differemment selon le navigateur :
#   - Chrome, Chromium, Brave : toute extension demandant la permission
#     « proxy » est refusee. Les autres restent installables.
#   - Firefox : ne sait pas filtrer par permission. Sa policy Proxy verrouillee
#     bloque proxy.settings mais PAS proxy.onRequest, que les extensions VPN
#     utilisent justement. L'installation de nouvelles extensions est donc
#     interdite ; celles deja en place continuent de fonctionner.
#
# Pour autoriser une extension Firefox precise, ajouter son identifiant a la
# liste « Allow » de InstallAddonsPermission dans
# /etc/firefox/policies/policies.json — il faut etre root, et le self-heal
# restaurera le modele : modifier aussi
# /usr/share/blocker-adulte/policies/firefox-policies.json.

# --- Tor et VPN --------------------------------------------------------------
# Apres les extensions de navigateur, Tor Browser est le contournement le plus
# facile : portable, il se telecharge, s'extrait et se lance sans aucun droit
# root. Son point faible est que le bootstrap passe obligatoirement par l'une
# des neuf autorites d'annuaire, dont les adresses sont fixes, publiques et
# codees en dur dans le logiciel. Les bloquer suffit a l'empecher de demarrer.
# Restent les bridges obfs4, qu'il faut demander et saisir a la main : c'est la
# demarche deliberee que l'outil n'a pas vocation a empecher.
#
# Cote VPN, ces regles ne bloquent PAS les VPN en general — ce serait
# impossible sans refuser tout le trafic sortant. Elles ferment les
# configurations par defaut : WireGuard 51820, OpenVPN 1194, IPsec 500/4500 et
# ESP/AH, L2TP 1701, PPTP 1723 et GRE, proxys SOCKS/HTTP sur leurs ports
# habituels. Un tunnel deliberement place sur le port 443 reste indiscernable
# d'une connexion HTTPS et passera.
#
# Les reseaux prives (10/8, 172.16/12, 192.168/16) sont epargnes : un VPN vers
# une passerelle du reseau local n'est pas un contournement.
#
#   oui (defaut)  Tor et protocoles VPN par defaut bloques
#   non           aucune de ces regles n'est chargee. A choisir si vous avez
#                 besoin d'un VPN d'entreprise ou de teletravail.
#
# Apres modification :
#   sudo /usr/lib/blocker-adulte/blocker-apply-nftables --force
BLOCKER_BLOCK_TUNNELS="oui"

# --- Listes de blocage ------------------------------------------------------
# Une URL par ligne, recuperees quotidiennement par blocker-list-update.timer.
# Formats acceptes : « hosts » (0.0.0.0 domaine) et dnsmasq natif
# (address=/domaine/).
#
# Une liste qui rendrait moins de 100 entrees est consideree comme une page
# d'erreur et ignoree : les listes deja en place sont alors conservees.
BLOCKER_LIST_URLS="https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn-only/hosts
https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/doh-vpn-proxy-bypass.txt"
