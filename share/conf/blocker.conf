# blocker-adulte — configuration locale
#
# Installe dans : /etc/blocker-adulte/blocker.conf
#
# CE FICHIER EST UNE PROPOSITION
#
# La configuration EN VIGUEUR est /var/lib/blocker-adulte/conf/blocker.conf,
# immuable et suivie par auditd. Modifier ce fichier-ci propose un changement :
#
#   - ce qui RENFORCE la protection est applique a la passe de self-heal
#     suivante (5 minutes au plus), ou tout de suite par « sudo blocker-delai » ;
#   - ce qui l'AFFAIBLIT devient une demande, applicable apres le delai
#     (BLOCKER_DELAI_HEURES, 48 h par defaut), puis a confirmer dans les sept
#     jours par « sudo blocker-delai --confirmer ID ». Sans confirmation, la
#     demande expire et ce fichier est remis a la configuration en vigueur.
#
# Dans le doute — un amont DNS change, par exemple — une modification est
# traitee comme un affaiblissement.
#
# Ce fichier n'est jamais execute tel quel : seules les affectations des
# variables ci-dessous sont acceptees, sans « $ », sans accent grave et sans
# barre oblique inverse. Une ligne non reconnue fait refuser toute la
# proposition, et « sudo blocker-delai » dit laquelle.
#
# Apres modification :
#   sudo blocker-delai

# --- Delai -------------------------------------------------------------------
# Heures entre une demande qui affaiblit la protection et le moment ou elle
# peut etre confirmee. Plancher : 24. Le reduire est lui-meme soumis au delai
# en vigueur ; l'augmenter s'applique tout de suite.
BLOCKER_DELAI_HEURES="48"

# --- Rapport a une personne de confiance -------------------------------------
# Chaque semaine, un rapport part vers cette adresse : etat de l'outil,
# reparations, demandes soumises au delai, modifications des fichiers proteges,
# demarrages de la machine. Il part meme quand rien ne s'est passe, numerote :
# si les rapports s'arretent, la personne le remarque. Chaque demande qui
# affaiblit la protection lui est en plus signalee au moment ou elle est
# deposee.
#
# Le rapport ne contient aucune adresse de site visite.
#
# Envoi par un serveur SMTP (smtps://serveur:465 ou smtp://serveur:587). Le
# mot de passe ne va PAS ici : une ligne « utilisateur:mot-de-passe » dans
# /etc/blocker-adulte/rapport-smtp.secret, puis
#   sudo chmod 600 /etc/blocker-adulte/rapport-smtp.secret
# Sans serveur SMTP, le sendmail local est utilise s'il existe.
#
# Verifier : sudo /usr/lib/blocker-adulte/blocker-rapport --test
# Apercu   : sudo /usr/lib/blocker-adulte/blocker-rapport --apercu
#
# Ajouter un destinataire s'applique tout de suite ; le changer ou le retirer
# attend le delai, et le destinataire actuel en est prevenu.
BLOCKER_RAPPORT_DESTINATAIRE=""
BLOCKER_RAPPORT_EXPEDITEUR=""
BLOCKER_RAPPORT_SMTP=""

# --- Langue des messages ----------------------------------------------------
# Tout ce que l'outil affiche existe en francais et en anglais.
#
#   auto (defaut)  suit LC_ALL, LC_MESSAGES ou LANG ; a defaut la locale du
#                  systeme (/etc/locale.conf, /etc/default/locale) ; a defaut
#                  l'anglais. C'est cette derniere source qui compte pour les
#                  services systemd, qui demarrent sans LANG : sans elle, le
#                  journal parlerait anglais pendant que le terminal parle
#                  francais.
#   fr             francais, quoi qu'en dise l'environnement
#   en             anglais, quoi qu'en dise l'environnement
#
# Pour une seule commande, sans toucher a ce fichier :
#   BLOCKER_LANG=en sudo -E blocker-status
#
# La suite de tests, elle, ne rend compte qu'en francais — c'est assume et
# explique dans le README. Changer de langue s'applique tout de suite.
BLOCKER_LANG="auto"

# --- Hook initramfs sous Arch (mkinitcpio) ----------------------------------
# Sans objet ailleurs. mkinitcpio n'execute que les hooks listes dans HOOKS=
# de /etc/mkinitcpio.conf : deposer les fichiers ne suffit pas. Mais une ligne
# HOOKS erronee empeche la machine de demarrer, et ce fichier ne nous
# appartient pas.
#
#   non (defaut)  les fichiers sont poses, /etc/mkinitcpio.conf n'est pas
#                 touche. « blocker-status » indique la ligne a ajouter.
#   oui           /etc/mkinitcpio.conf est sauvegarde puis modifie, et
#                 « mkinitcpio -P » lance. Si la reconstruction echoue, la
#                 sauvegarde est restauree et l'image reconstruite a partir
#                 d'elle : le composant 4 se declare inactif plutot que de
#                 laisser une image non amorcable.
BLOCKER_MKINITCPIO_HOOK="non"

# --- Resolveurs amont -------------------------------------------------------
# Servent de secours pour tout domaine absent des listes locales. La valeur par
# defaut est AdGuard DNS Family, qui filtre deja le contenu adulte cote serveur :
# c'est une deuxieme barriere, independante des listes locales.
#
# Autres resolveurs filtrants possibles :
#
#   AdGuard DNS Family    94.140.14.15 / 94.140.15.16   (defaut)
#     Filtre a la fois le contenu adulte, les publicites et les traqueurs, et
#     force le SafeSearch cote serveur — ce qui vient en redondance du
#     composant SafeSearch local. Contreparties : un filtrage plus large casse
#     occasionnellement un site legitime, et une societe tierce voit toutes vos
#     requetes DNS.
#
#   Cloudflare for Families  1.1.1.3 / 1.0.0.3
#     Adulte + malware seulement, pas de publicites. Plus rapide et plus
#     neutre : moins de faux positifs, politique de non-conservation des
#     journaux auditee publiquement. A preferer si un site utile casse.
#
#   CleanBrowsing Family     185.228.168.168 / 185.228.169.168
#   OpenDNS FamilyShield     208.67.222.123 / 208.67.220.123
#   Quad9 (securite seule, sans filtre adulte)  9.9.9.9
#
# Tout changement d'amont est traite comme un affaiblissement et attend le
# delai : rien ne permet de juger automatiquement qu'un amont filtre autant
# qu'un autre.
BLOCKER_UPSTREAM_1="94.140.14.15"
BLOCKER_UPSTREAM_2="94.140.15.16"

# --- Rythme des watchdogs ---------------------------------------------------
# Intervalle, en secondes, entre deux passes de blocker-guard et de la boucle
# de surveillance croisee du resolveur.
#
# Doit rester nettement inferieur au WatchdogSec des unites systemd (60 s) :
# au-dela, systemd considererait les services bloques et les redemarrerait en
# boucle. Valeurs raisonnables : 10 a 25.
BLOCKER_GUARD_INTERVAL="15"

# --- Verrouillage de /etc/hosts ---------------------------------------------
# Une seule ligne dans /etc/hosts contourne entierement le resolveur : la
# resolution systeme lit ce fichier avant d'interroger le DNS. C'est le
# contournement le plus simple qui existe.
#
# Le rendre immuable ferme ce trou, mais /etc/hosts appartient au systeme et
# d'autres logiciels l'ecrivent legitimement (Docker, podman, LXC, Vagrant,
# cloud-init).
#
#   auto  (defaut) verrouille, sauf si l'un de ces logiciels est detecte ;
#                  l'abstention est journalisee
#   oui            verrouille toujours — peut casser Docker et consorts
#   non            ne verrouille jamais ; /etc/hosts reste seulement surveille
#                  par auditd (composant 8)
BLOCKER_LOCK_HOSTS="auto"

# --- SafeSearch force -------------------------------------------------------
# Fait resoudre Google, YouTube, Bing, DuckDuckGo et Yandex vers leur variante
# verrouillee en mode strict (forcesafesearch.google.com, etc.).
#
# C'est la mesure la plus efficace de tout l'outil : une liste de blocage ne
# peut rien contre Google Images ou YouTube, qu'on ne peut pas bloquer sans
# rendre la machine inutilisable. Forcer le SafeSearch au niveau du reseau rend
# le reglage impossible a changer depuis le navigateur ou le compte, et vaut
# pour toutes les applications de la machine.
#
# Les adresses sont resolues a chaque mise a jour, jamais codees en dur.
#
#   oui (defaut)  SafeSearch force
#   non           desactive ; le fichier genere est retire (soumis au delai)
BLOCKER_SAFESEARCH="oui"

# --- Categories de blocage livrees ------------------------------------------
# Listes de domaines livrees avec l'outil, dans
# /usr/share/blocker-adulte/categories/ :
#
#   moteurs-sans-filtre    moteurs de recherche dont le mode strict ne peut pas
#                          etre force par le DNS (Brave Search, Yahoo,
#                          Startpage, Ecosia, Qwant...)
#   frontends-alternatifs  interfaces alternatives de YouTube et de Reddit, ou
#                          le mode restreint de YouTube ne s'applique pas
#   reseaux-sociaux        Reddit, X (Twitter), Bluesky, Tumblr, Telegram — y
#                          compris l'application Telegram, bloquee par adresse
#   chat-video             discussion video avec des inconnus (Omegle et clones)
#   streaming              MovieBox et applications du meme genre
#
# Toutes sont actives d'office. En retirer une est soumis au delai ; en ajouter
# s'applique tout de suite.
BLOCKER_CATEGORIES="moteurs-sans-filtre frontends-alternatifs reseaux-sociaux chat-video streaming"

# --- Extensions de navigateur -----------------------------------------------
# Le contournement le plus facile de tout le dispositif ne demande aucun droit
# root : installer une extension VPN/proxy dans le navigateur. Tout le trafic
# part alors chiffre vers un serveur tiers qui fait sa propre resolution DNS,
# invisible pour le resolveur local comme pour nftables.
#
# Les policies deployees ferment ce trou differemment selon le navigateur :
#   - Chrome, Chromium, Brave : toute extension demandant la permission
#     « proxy » est refusee. Les autres restent installables.
#   - Firefox : ne sait pas filtrer par permission. Sa policy Proxy verrouillee
#     bloque proxy.settings mais PAS proxy.onRequest, que les extensions VPN
#     utilisent justement. L'installation de nouvelles extensions est donc
#     interdite ; celles deja en place continuent de fonctionner.
#
# Pour autoriser une extension Firefox precise, ajouter son identifiant a la
# liste « Allow » de InstallAddonsPermission dans
# /etc/firefox/policies/policies.json — il faut etre root, et le self-heal
# restaurera le modele : modifier aussi
# /usr/share/blocker-adulte/policies/firefox-policies.json.

# --- Tor et VPN --------------------------------------------------------------
# Bloque le demarrage de Tor Browser (autorites d'annuaire) et les protocoles
# VPN et proxy dans leur configuration par defaut : WireGuard, OpenVPN, IPsec,
# L2TP, PPTP, proxys SOCKS/HTTP. Ce n'est pas un blocage de tout tunnel
# possible — ce serait impossible sans couper le reseau.
#
# Les reseaux prives (10/8, 172.16/12, 192.168/16) sont epargnes : un VPN vers
# une passerelle du reseau local n'est pas un contournement.
#
#   oui (defaut)  Tor et protocoles VPN par defaut bloques
#   non           aucune de ces regles n'est chargee. A choisir si vous avez
#                 besoin d'un VPN d'entreprise ou de teletravail.
#
# Passer a « non » est soumis au delai.
BLOCKER_BLOCK_TUNNELS="oui"

# --- Listes de blocage ------------------------------------------------------
# Une URL https par ligne, recuperees quotidiennement par
# blocker-list-update.timer. Formats acceptes : « hosts » (0.0.0.0 domaine),
# dnsmasq (address=, server=, local=), adblock simple (||domaine^) et un
# domaine par ligne. Seuls les noms de domaine en sont retenus : la liste ne
# peut que bloquer, jamais rediriger.
#
# Une liste en echec, de moins de 100 entrees, ou de moins de la moitie de sa
# taille precedente garde sa version precedente.
#
# Ajouter une URL s'applique tout de suite ; en retirer une attend le delai.
#
# Les trois listes par defaut : sites adultes (StevenBlack), contournements
# du DNS — DoH, VPN, proxys (Hagezi), sites de streaming et de telechargement
# pirates, qui changent de domaine sans cesse (Hagezi « anti.piracy »).
BLOCKER_LIST_URLS="https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn-only/hosts
https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/doh-vpn-proxy-bypass.txt
https://raw.githubusercontent.com/hagezi/dns-blocklists/main/dnsmasq/anti.piracy.txt"

# --- Adresses des resolveurs DoH --------------------------------------------
# Listes d'adresses IP de resolveurs DNS-over-HTTPS maintenues par la
# communaute, recuperees chaque jour, une URL https par ligne. Les adresses
# sont chargees avec les regles nftables (port 443 refuse vers elles). Les
# reseaux prives et les prefixes trop larges en sont ecartes.
BLOCKER_DOH_IP_URLS="https://raw.githubusercontent.com/dibdot/DoH-IP-blocklists/master/doh-ipv4.txt
https://raw.githubusercontent.com/dibdot/DoH-IP-blocklists/master/doh-ipv6.txt"
