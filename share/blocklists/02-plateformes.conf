# blocker-adulte — plateformes mixtes (composant 1, liste categorielle)
#
# Installee dans : /var/lib/blocker-adulte/blocklists/02-plateformes.conf
#
# POURQUOI CETTE LISTE EXISTE
#
# Les listes publiques (StevenBlack porn-only, Hagezi NSFW) classent par
# DOMAINE DEDIE : un domaine y entre parce que le site ne fait que ca. Elles
# sont excellentes pour cet usage et inutilisables pour un autre — celui des
# plateformes qui ne sont pas des sites adultes mais par lesquelles du contenu
# adulte arrive quand meme :
#
#   - un catalogue de streaming non officiel, sans classification d'age, ou
#     les titres erotiques cotoient les films grand public ;
#   - une regie publicitaire adulte, qui ouvre une page porno en fond a chaque
#     clic sur « lecture » ;
#   - une application de bureau ou mobile qui embarque son propre catalogue et
#     ne passe par aucun navigateur.
#
# Le point de depart de ce fichier est MovieBox, trouve sur un PC protege par
# l'outil et parfaitement resolu. Verification faite sur la liste Hagezi NSFW
# du 18/09/2026 : 74 633 domaines, dont « moviebox.com » — mais aucun des
# domaines par lesquels MovieBox est reellement distribue. Meme mesure pour
# 123movies, soap2day, hdtoday, putlocker, primewire, vidsrc, streameast,
# netmirror : zero entree. Ce n'est pas un defaut de ces listes, c'est leur
# critere d'admission.
#
# CE QUE CETTE LISTE NE PEUT PAS FAIRE
#
# Ces plateformes changent de domaine plus vite qu'une liste ne se met a jour :
# meme nom, nouveau TLD (fmovies.to -> fmovies.co -> fmoviesz.to). Enumerer ne
# suffit donc pas, et c'est assume. La rotation se couvre par motif :
#
#   sudo blocker-block --motif moviebox
#
# qui bloque le nom sur une centaine d'extensions et ses variantes numerotees,
# d'un coup et hors ligne. Ce fichier tient les domaines confirmes ; la
# commande tient ce qui bouge.
#
# Ce fichier est remplace a chaque mise a jour du paquet : ne pas l'editer.
# Les ajouts personnels se font avec « blocker-block », qui ecrit dans
# 50-perso.conf et n'est jamais ecrase.
#
# Format dnsmasq : « address=/domaine/# » couvre le domaine ET tous ses
# sous-domaines.

# --- MovieBox --------------------------------------------------------------
# Application PC et Android, catalogue non classifie, distribuee hors magasin.
address=/moviebox.ng/#
address=/moviebox.pro/#
address=/moviebox.com/#
address=/moviebox.id/#
address=/moviebox.ph/#
address=/movieboxpro.app/#
address=/inmoviebox.com/#
address=/moviebox.vip/#

# --- Applications de streaming du meme type --------------------------------
# Meme modele : un client a installer, un catalogue interne, aucun filtre.
address=/netmirror.app/#
address=/netmirror.pro/#
address=/flixtor.to/#
address=/flixtor.se/#
address=/popcorntime.app/#
address=/popcorn-time.tw/#
address=/stremio.com/#
address=/cinemabox.cc/#
address=/showbox.media/#
address=/showboxapp.net/#

