# --- Lecteurs embarques et agregateurs -------------------------------------
# Ce sont eux qui servent la publicite adulte aux sites ci-dessus. Les bloquer
# casse le lecteur meme quand le site de facade a change de domaine : c'est la
# partie de la chaine qui bouge le moins.
address=/vidsrc.to/#
address=/vidsrc.me/#
address=/vidsrc.xyz/#
address=/vidsrc.net/#
address=/vidsrc.pro/#
address=/streameast.to/#
address=/streameast.live/#
