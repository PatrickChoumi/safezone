# blocker-adulte — categories adultes que les listes publiques ne couvrent pas
#
# Installee dans : /var/lib/blocker-adulte/blocklists/03-nsfw.conf
#
# POURQUOI CE FICHIER EXISTE
#
# Meme raison que 02-plateformes.conf, autres categories. Mesure faite le
# 18/09/2026 contre les trois listes par defaut reunies (153 093 domaines
# uniques : StevenBlack porn-only, Hagezi NSFW, Hagezi doh-vpn-proxy) :
#
#   compagnons IA « sans filtre »   0 / 6 couverts
#   imageboards                      0 / 3 couverts
#   outils de deshabillage           6 / 9 couverts
#   hebergeurs de dumps adultes     10 / 13 couverts
#
# Les compagnons IA sont le trou le plus net : la categorie est trop recente
# pour que les listes l'aient vue. Ce sont des sites de conversation erotique,
# souvent annonces comme « sans filtre » et sans verification d'age.
#
# CE QUI N'EST PAS ICI
#
# Tout ce qui a un usage legitime serieux — civitai, pixiv, mangadex, reddit,
# les hebergeurs de fichiers generalistes, les sites de torrent — vit dans
# /usr/share/blocker-adulte/categories/ et ne se pose que si on le demande :
#
#   sudo blocker-block --categorie            voir les categories
#   sudo blocker-block --categorie tout       toutes les activer
#
# Ce fichier est remplace a chaque mise a jour du paquet : ne pas l'editer.
# Les ajouts personnels se font avec « blocker-block ».

