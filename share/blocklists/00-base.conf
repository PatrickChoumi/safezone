# --- Note ------------------------------------------------------------------
# Aucun domaine adulte n'est liste en dur dans ce fichier : cette categorie est
# entierement fournie par la liste StevenBlack « porn-only », recuperee par
# blocker-list-update. Un depot git n'est pas un bon endroit pour une telle
# enumeration, et une liste figee vieillirait mal.
#
# Consequence : tant que la premiere mise a jour de liste n'a pas eu lieu, le
# blocage adulte repose uniquement sur le resolveur amont filtrant
# (1.1.1.3 / 1.0.0.3, Cloudflare for Families) configure dans
# /etc/dnsmasq.d/blocker-adulte.conf. Lancer la premiere mise a jour
# immediatement apres l'installation :
#   sudo systemctl start blocker-list-update.service
