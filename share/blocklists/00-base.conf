# blocker-adulte — liste de blocage de base (composant 1)
#
# Installee dans : /var/lib/blocker-adulte/blocklists/00-base.conf
#
# Filet de securite minimal, livre avec le paquet, pour que le blocage soit
# effectif des la pose et sur une machine hors ligne. Les vraies listes
# (dizaines de milliers de domaines) sont recuperees par
# blocker-list-update.timer et deposees dans le meme repertoire sous
# 10-liste.conf, 11-liste.conf, etc.
#
# Ce fichier n'est JAMAIS supprime par la mise a jour des listes.
#
# Format dnsmasq : « address=/domaine/# » renvoie NXDOMAIN pour le domaine et
# tous ses sous-domaines.

# --- Contournement DNS : resolveurs DoH publics ----------------------------
# Empeche un navigateur ou une application de trouver un resolveur chiffre.
# Complete par les regles nftables du composant 2, qui bloquent les IP
# d'amorcage correspondantes.
address=/dns.google/#
address=/dns.google.com/#
address=/cloudflare-dns.com/#
address=/mozilla.cloudflare-dns.com/#
address=/one.one.one.one/#
address=/dns.quad9.net/#
address=/dns10.quad9.net/#
address=/dns11.quad9.net/#
address=/dns.adguard.com/#
address=/dns.adguard-dns.com/#
address=/unfiltered.adguard-dns.com/#
address=/dns.nextdns.io/#
address=/doh.opendns.com/#
address=/doh.cleanbrowsing.org/#
address=/dns.controld.com/#
address=/freedns.controld.com/#
address=/doh.mullvad.net/#
address=/dns.mullvad.net/#
address=/dns.sb/#
address=/doh.dns.sb/#
address=/dns.libredns.gr/#
address=/doh.libredns.gr/#
address=/odoh.cloudflare-dns.com/#
address=/security.cloudflare-dns.com/#
address=/dns.digitale-gesellschaft.ch/#
address=/dnsforge.de/#
address=/doh.ffmuc.net/#
address=/dns.twnic.tw/#
address=/doh.360.cn/#
address=/dns.alidns.com/#

