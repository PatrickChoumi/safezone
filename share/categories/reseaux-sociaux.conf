# Categorie « reseaux-sociaux » — plateformes generalistes
#
# LA categorie a peser avant d'activer. Le contenu adulte y est present et
# atteignable en quelques gestes depuis un onglet deja ouvert — c'est le chemin
# le plus court vers le geste impulsif, celui contre lequel un filtrage DNS ne
# peut rien a l'interieur du domaine. Mais bloquer reddit.com, x.com ou
# discord.com coupe aussi tout l'usage normal de la machine.
#
# Avant d'activer la categorie entiere, essayez le blocage domaine par domaine :
#   sudo blocker-block reddit.com
address=/reddit.com/#
address=/redd.it/#
address=/x.com/#
address=/twitter.com/#
address=/tumblr.com/#
address=/discord.com/#
address=/discordapp.com/#
address=/bsky.app/#
address=/vk.com/#
address=/t.me/#
address=/telegram.org/#
