# blocker-adulte — configuration du resolveur DNS local (composant 1)
#
# Installe dans : /etc/dnsmasq.d/blocker-adulte.conf
#
# Ce fichier est utilise comme --conf-file par blocker-resolver.service ; il
# n'est PAS charge par le service dnsmasq de la distribution. Les deux peuvent
# coexister : ce resolveur ecoute sur 127.0.0.1:53, le stub de systemd-resolved
# reste sur 127.0.0.53:53.

# --- Ne pas heriter de la configuration systeme ---------------------------
# On n'inclut deliberement pas /etc/dnsmasq.conf ni /etc/dnsmasq.d : cette
# instance doit etre entierement decrite par ce fichier.
no-resolv
no-poll
no-hosts

# --- Ecoute ----------------------------------------------------------------
listen-address=127.0.0.1
port=53
bind-interfaces
user=blocker-adulte
group=blocker-adulte
pid-file=/run/blocker-adulte/dnsmasq.pid

# --- Resolveurs amont filtrants --------------------------------------------
# Ils ne sont PAS ecrits ici : blocker-upstream les genere dans
# /var/lib/blocker-adulte/blocklists/01-upstream.conf a partir de
# BLOCKER_UPSTREAM_1 / BLOCKER_UPSTREAM_2 de /etc/blocker-adulte/blocker.conf.
#
# Les coder en dur dans ce fichier les rendait en pratique immuables : le
# self-heal restaure ce modele a chaque passe, donc toute modification etait
# effacee dans les cinq minutes — alors que la documentation annoncait le
# contraire. Passer par un fichier genere rend blocker.conf reellement
# maitre de ce reglage.
#
# Changer d'amont :
#   sudo nano /etc/blocker-adulte/blocker.conf
#   sudo /usr/lib/blocker-adulte/blocker-upstream
#   sudo systemctl restart blocker-resolver.service

# --- Listes de blocage generees --------------------------------------------
# Alimentees par blocker-list-update.timer (composant 7 bis) depuis
# StevenBlack porn-only + Hagezi doh-vpn-proxy-bypass. Une liste de base est
# livree avec le paquet pour que l'outil fonctionne hors ligne des la pose.
conf-dir=/var/lib/blocker-adulte/blocklists,*.conf

# --- Durcissement ----------------------------------------------------------
# Refuser les requetes qui n'ont pas de sens en local.
domain-needed
bogus-priv
stop-dns-rebind
rebind-localhost-ok

# Empeche la resolution des enregistrements HTTPS/SVCB (type 65) qui
# annoncent les endpoints DoH aux navigateurs et permettent une bascule
# automatique vers DNS-over-HTTPS.
filter-rr=65

# Journalisation : compteurs de requetes bloquees, sans enregistrer l'historique
# de navigation en clair. Passer a log-queries pour un diagnostic ponctuel.
log-facility=-
quiet-dhcp

# Taille du cache
cache-size=10000
