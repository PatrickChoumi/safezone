# blocker-adulte — bascule de systemd-resolved vers le resolveur local
#
# Installe dans : /etc/systemd/resolved.conf.d/blocker-adulte.conf
#
# Ce drop-in ne modifie pas /etc/systemd/resolved.conf : le retirer suffit a
# rendre a systemd-resolved son comportement d'origine (voir README, etape 6
# de la desinstallation).

[Resolve]
# Tout passe par le resolveur local du composant 1.
DNS=127.0.0.1
# ~. = route de recherche « attrape-tout » : aucun domaine ne peut etre resolu
# par un serveur fourni par le DHCP ou le VPN.
Domains=~.
# Empeche systemd-resolved d'utiliser les DNS pousses par les liens reseau.
# Sans cela, un VPN ou un portail captif reprendrait la main sur la resolution.
FallbackDNS=
# DoH/DoT sortants depuis resolved lui-meme : desactives, c'est le resolveur
# local (et lui seul) qui parle au monde exterieur.
DNSOverTLS=no
DNSSEC=allow-downgrade
# Le stub 127.0.0.53 reste actif pour que /etc/resolv.conf standard fonctionne.
DNSStubListener=yes
# Le cache de resolved est desactive : le cache utile est celui de dnsmasq, et
# un double cache masque les mises a jour de liste de blocage.
Cache=no
